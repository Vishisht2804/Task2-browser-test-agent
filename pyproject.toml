[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-agent"
version = "0.3.0"
description = "An AI-assisted agent that converts natural-language test cases into browser actions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - take-home assignment" }
authors = [{ name = "Browser Agent Project" }]
dependencies = [
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<2.0",
  "ruff>=0.6,<1.0",
]
browser = [
  "playwright>=1.47,<2.0",
]

[project.scripts]
browser-agent = "browser_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
